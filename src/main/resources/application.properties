quarkus.jackson.serialization-inclusion=non_null
# disable the following console log environment variables for stdio
#quarkus.log.console.enable=false
#quarkus.log.console.stderr=false
quarkus.mcp.server.stdio.enabled=false
quarkus.banner.enabled=false

# @QuarkusTest only - has no effect on dev or prod runs.
# src/main/java/io/quarkiverse/mcp/server/runtime/McpMessageHandler.java deliberately shadows a
# class from the quarkus-mcp-server extension. The default test classloader keeps application
# classes and extension classes apart, so the extension's beans cannot see our copy and the boot
# fails with ClassNotFoundException on that class. A flat classpath puts them in one loader,
# which is how the packaged application already behaves.
quarkus.test.flat-class-path=true
