name: Publish to GHCR

# Publishes the image to GitHub Container Registry so it can be used on any machine
# with `docker run`, without cloning or building the project.
#
# Unlike docker-publish.yml (Docker Hub), this needs no configured secrets: it
# authenticates with the automatically provided GITHUB_TOKEN. The two workflows are
# independent on purpose - a missing Docker Hub secret must not stop this one.
#
# Images are pushed to ghcr.io/<owner>/jdbc-mcp. Packages are private by default; make
# the package public in the repository's Packages settings, or `docker login ghcr.io`
# on the machine that pulls it.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. dev)'
        required: true
        default: 'dev'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw package

      - name: Work out the image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jdbc-mcp"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE}:${VERSION}"
            # Only a plain semver tag moves ':latest'.
            if [[ "${VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              TAGS="${TAGS},${IMAGE}:latest"
            fi
          else
            TAGS="${IMAGE}:${{ github.event.inputs.tag }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # linux/amd64 only. To also serve Apple Silicon natively, add
          # `platforms: linux/amd64,linux/arm64` here and a docker/setup-qemu-action step
          # above; an amd64 image still runs on ARM through emulation.
